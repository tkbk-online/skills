name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Security audit of every skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests of the audit tool
        run: node --test "tools/*.test.mjs"
      - name: Audit skills (report goes to the job summary)
        run: node tools/audit.mjs skills --summary "$GITHUB_STEP_SUMMARY"
      - name: README, catalog.json and index.html match the skill folders
        run: node tools/build-catalog.mjs --check
