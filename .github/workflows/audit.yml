name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Security audit of every skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests of the audit tool
        run: node --test "tools/*.test.mjs"
      - name: Audit skills (report goes to the job summary)
        run: node tools/audit.mjs skills --summary "$GITHUB_STEP_SUMMARY"
      - name: Every skill folder is referenced in the README catalogs
        run: |
          for d in skills/*/; do
            n=$(basename "$d")
            grep -q "skills/$n/SKILL.md" README.md || { echo "README.md does not list $n"; exit 1; }
          done
